[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe_helper"
version = "0.1.0"
description = "A Streamlit app and CLI for generating recipes from ingredients using LangGraph and Gemini."
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.52.2",
    "google-genai==1.57.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "python-dotenv==1.2.1",
    "pillow==12.1.0",
    "tenacity==9.1.2",
    "langgraph==1.0.5",
    "requests==2.32.5",
    "httpx==0.28.1",
    "pytz==2025.2",
    "structlog==25.1.0",
    "watchtower==3.3.1"
]

[project.scripts]
recipe-helper-ui = "recipe_helper.cli.ui_cli:main"
recipe-helper-graph = "recipe_helper.cli.graph_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
